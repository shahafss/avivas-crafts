<style>
/* Layout: Shopify "Balance"-like storefront rebuilt for Aviva's Crafts — full-bleed photo bands, white product grid, peach statement band, mint footer. Single light look by choice (the shop has no dark theme). */
:root {
  --paper: #FFFFFF;
  --ink: #061406;
  --ink-2: #3E4E3F;
  --sage: #CFE2D0;
  --sage-hover: #BCD6BE;
  --forest: #1E4620;
  --peach: #F7E5D7;
  --mint: #A3D9A5;
  --line: #DDE5DD;
  --photo: #EEF2EE;
  --alert: #A32018;
  --on-photo: #FFFFFF;
  --mock: #FFF6D8;
  --font: "Assistant", "Heebo", "Arial Hebrew", Arial, sans-serif;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --max: 1240px;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--paper); }
a { color: inherit; }
img { max-width: 100%; display: block; }
:focus-visible { outline: 3px solid var(--forest); outline-offset: 2px; }
.wrap { max-width: var(--max); margin-inline: auto; padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.wrap > * { min-width: 0; }
.tnum { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Mock note (not part of the shop) */
.mock-note { background: var(--mock); color: var(--ink); font-size: 14px; border-bottom: 1px dashed #C9B66A; }
.mock-note .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding-block: 8px; }
.mock-note b { font-weight: 700; }
.lang-toggle { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 999px; overflow: hidden; }
.lang-toggle button { font: inherit; font-weight: 700; font-size: 14px; border: 0; background: transparent; color: var(--ink); padding: 6px 14px; min-height: 36px; cursor: pointer; }
.lang-toggle button[aria-pressed="true"] { background: var(--ink); color: var(--paper); }

/* Free-shipping strip */
.strip { background: var(--forest); color: var(--paper); font-size: 13px; font-weight: 700; text-align: center; }
.strip .wrap { padding-block: 8px; }

/* Header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; color: var(--on-photo); transition: background-color .2s ease-out, color .2s ease-out, box-shadow .2s ease-out; }
.site-header.solid { background: var(--paper); color: var(--ink); box-shadow: 0 1px 0 var(--line); }
.site-header .wrap { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 64px; gap: 12px; }
.h-start, .h-end { display: flex; align-items: center; gap: 4px; }
.h-end { justify-content: flex-end; }
.h-links { display: none; gap: 4px; }
.h-links a { text-decoration: none; font-size: 15px; padding: 10px 10px; min-height: 44px; display: inline-flex; align-items: center; }
.h-links a:hover { text-decoration: underline; text-underline-offset: 4px; }
.brand { font-weight: 700; font-size: clamp(17px, 4.6vw, 22px); text-decoration: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: center; }
.icon-btn { width: 44px; height: 44px; display: inline-grid; place-items: center; border: 0; background: transparent; color: inherit; border-radius: 999px; cursor: pointer; position: relative; text-decoration: none; }
.icon-btn svg { width: 22px; height: 22px; }
.badge { position: absolute; inset-block-start: 4px; inset-inline-end: 2px; min-width: 18px; height: 18px; padding: 0 4px; border-radius: 999px; background: var(--sage); color: var(--ink); font-size: 11px; font-weight: 800; display: grid; place-items: center; }
.lang-pill { position: relative; height: 34px; padding: 0 12px; border: 1.5px solid currentColor; border-radius: 999px; font-size: 13px; font-weight: 700; display: inline-flex; align-items: center; text-decoration: none; margin-inline-end: 4px; }
.lang-pill::before { content: ""; position: absolute; inset: -6px -2px; }
.only-phone { display: inline-grid; }
.h-search-desk { display: none; }
@media (min-width: 900px) {
  .h-links { display: flex; }
  .only-phone { display: none; }
  .h-search-desk { display: inline-grid; }
  .site-header .wrap { min-height: 72px; }
}

/* Hero */
.hero { position: relative; margin-top: -64px; color: var(--on-photo); overflow: hidden; background: #3a3128; }
@media (min-width: 900px) { .hero { margin-top: -72px; } }
.hero img { width: 100%; height: clamp(560px, 150vw, 640px); object-fit: cover; object-position: 30% 50%; }
@media (min-width: 640px) { .hero img { height: clamp(460px, 48vw, 720px); object-position: 50% 50%; } }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgb(0 0 0 / .45) 0%, rgb(0 0 0 / .05) 32%, rgb(0 0 0 / .05) 55%, rgb(0 0 0 / .55) 100%); }
.hero-copy { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: space-between; padding-block: 92px 28px; }
@media (min-width: 900px) { .hero-copy { padding-block: 104px 40px; } }
.hero-line { font-size: clamp(18px, 2.2vw, 24px); font-weight: 400; max-width: 32ch; margin: 0; text-shadow: 0 1px 8px rgb(0 0 0 / .35); }
.hero h1 { font-weight: 300; font-size: clamp(56px, 12vw, 150px); line-height: .95; letter-spacing: -0.02em; margin: 0; text-wrap: balance; text-shadow: 0 2px 18px rgb(0 0 0 / .3); }

/* Catalog */
.catalog { padding-block: 48px 64px; }
@media (min-width: 900px) { .catalog { padding-block: 72px 88px; } }
.section-title { font-size: clamp(30px, 4vw, 44px); font-weight: 700; line-height: 1.1; margin: 0 0 20px; letter-spacing: -0.01em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px; }
.chip { min-height: 44px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--ink-2); display: inline-flex; align-items: center; text-decoration: none; font-size: 15px; background: var(--paper); }
.chip:hover { background: var(--photo); }
.chip[aria-current="page"] { background: var(--sage); border-color: var(--sage); font-weight: 700; }
.chips.sort .chip { font-size: 14px; min-height: 44px; }
.grid { list-style: none; padding: 0; margin: 28px 0 0; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px 12px; }
@media (min-width: 640px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 40px 20px; } }
.card { text-decoration: none; display: grid; gap: 10px; }
.card .well { aspect-ratio: 1 / 1; max-width: 100%; background: var(--photo); overflow: hidden; }
.card .well img { width: 100%; height: 100%; object-fit: cover; transition: transform .4s ease-out; }
.card:hover .well img { transform: scale(1.03); }
.ph { width: 100%; height: 100%; display: grid; place-items: center; color: var(--ink-2); font-size: 13px; text-align: center; padding: 12px; }
.ph svg { width: 40px; height: 40px; margin: 0 auto 6px; display: block; opacity: .55; }
.card .name { font-size: clamp(19px, 2.2vw, 24px); font-weight: 400; line-height: 1.2; margin: 0; }
.card .price { font-size: 14px; color: var(--ink-2); margin: 0; }
.card .na { font-size: 13px; font-weight: 700; color: var(--alert); margin: 0; }

/* Photo banners */
.banner { position: relative; color: var(--on-photo); overflow: hidden; background: #3a3128; }
.banner img { width: 100%; height: clamp(520px, 140vw, 600px); object-fit: cover; }
@media (min-width: 640px) { .banner img { height: clamp(420px, 42vw, 620px); } }
.banner.child img { object-position: 58% 50%; }
.banner.shelf img { object-position: 50% 50%; }
.banner::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to left, rgb(0 0 0 / .62) 0%, rgb(0 0 0 / .25) 50%, rgb(0 0 0 / 0) 75%); }
:root[dir="ltr"] .banner::after { background: linear-gradient(to right, rgb(0 0 0 / .62) 0%, rgb(0 0 0 / .25) 50%, rgb(0 0 0 / 0) 75%); }
@media (max-width: 639px) { .banner::after, :root[dir="ltr"] .banner::after { background: linear-gradient(180deg, rgb(0 0 0 / .1) 30%, rgb(0 0 0 / .7) 100%); } }
.banner-copy { position: absolute; inset: 0; z-index: 1; display: flex; flex-direction: column; justify-content: flex-end; padding-block: 32px; }
@media (min-width: 640px) { .banner-copy { justify-content: center; } }
.banner-copy .inner { max-width: 30rem; display: grid; gap: 14px; justify-items: start; }
.banner h2 { font-size: clamp(40px, 6.4vw, 76px); font-weight: 800; line-height: 1; letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.banner p { font-size: clamp(17px, 1.8vw, 20px); margin: 0; max-width: 34ch; }
.btn-sage { min-height: 52px; padding: 0 28px; border-radius: 999px; background: var(--sage); color: var(--ink); font-weight: 600; font-size: 16px; display: inline-flex; align-items: center; text-decoration: none; transition: background-color .15s ease-out; }
.btn-sage:hover { background: var(--sage-hover); }

/* Peach band */
.band { background: var(--peach); }
.band .wrap { padding-block: 80px; }
@media (min-width: 900px) { .band .wrap { padding-block: 128px; } }
.band p { font-size: clamp(28px, 4.4vw, 52px); font-weight: 300; line-height: 1.2; margin: 0 auto; max-width: 24ch; text-align: center; text-wrap: balance; }

/* Footer */
.footer { background: var(--mint); color: var(--ink); font-size: 15px; }
.footer .wrap { padding-block: 48px 28px; display: grid; gap: 32px; }
.f-cols { display: grid; gap: 32px; }
@media (min-width: 900px) { .f-cols { grid-template-columns: 2fr 1fr 1fr; } .footer .wrap { padding-block: 64px 32px; } }
.footer h2 { font-size: 18px; font-weight: 700; margin: 0 0 12px; }
.footer ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 2px; }
.footer ul a { display: inline-flex; min-height: 36px; align-items: center; text-decoration: none; }
.footer ul a:hover { text-decoration: underline; text-underline-offset: 3px; }
.biz { display: grid; gap: 2px; }
.biz p { margin: 0; }
.social { display: flex; gap: 6px; margin-top: 14px; }
.social a { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 999px; border: 1.5px solid var(--ink); }
.social a:hover { background: var(--sage); }
.social svg { width: 20px; height: 20px; }
.f-bottom { border-top: 1px solid rgb(6 20 6 / .25); padding-top: 18px; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px 16px; font-size: 14px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { transition: none !important; }
  .card:hover .well img { transform: none; }
}
</style>

<script>
(function () {
  var root = document.documentElement;
  function setLang(l) {
    root.lang = l; root.dir = l === 'he' ? 'rtl' : 'ltr';
    document.querySelectorAll('[data-he]').forEach(function (el) { el.innerHTML = el.getAttribute('data-' + l); });
    document.querySelectorAll('[data-alt-he]').forEach(function (el) { el.alt = el.getAttribute('data-alt-' + l); });
    document.querySelectorAll('[data-label-he]').forEach(function (el) { el.setAttribute('aria-label', el.getAttribute('data-label-' + l)); });
    var other = l === 'he' ? 'en' : 'he';
    var pill = document.getElementById('hdr-lang');
    pill.textContent = l === 'he' ? 'EN' : 'עב';
    pill.lang = other;
    pill.setAttribute('aria-label', l === 'he' ? 'EN – English' : 'עב – עברית');
    var foot = document.getElementById('foot-lang');
    foot.textContent = l === 'he' ? 'English' : 'עברית';
    foot.lang = other;
    document.getElementById('to-he').setAttribute('aria-pressed', String(l === 'he'));
    document.getElementById('to-en').setAttribute('aria-pressed', String(l === 'en'));
    try { localStorage.setItem('mock-lang', l); } catch (e) {}
  }
  var start = 'he';
  try { start = localStorage.getItem('mock-lang') || 'he'; } catch (e) {}
  setLang(start);
  document.getElementById('to-he').addEventListener('click', function () { setLang('he'); });
  document.getElementById('to-en').addEventListener('click', function () { setLang('en'); });
  function swap(e) { e.preventDefault(); setLang(root.lang === 'he' ? 'en' : 'he'); }
  document.getElementById('hdr-lang').addEventListener('click', swap);
  document.getElementById('foot-lang').addEventListener('click', swap);

  var hdr = document.getElementById('hdr');
  var hero = document.querySelector('.hero');
  function onScroll() {
    var limit = hero.offsetTop + hero.offsetHeight - hdr.offsetHeight;
    hdr.classList.toggle('solid', window.scrollY > limit - 8);
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('resize', onScroll);
  onScroll();
})();
</script>
