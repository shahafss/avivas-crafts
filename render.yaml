# Render Blueprint for Aviva's Crafts (production only: there is no staging).
#
# Creates, all in Frankfurt:
#   - avivas-crafts          web service (Node), deployed from `main` on every commit (does not wait for CI; owner decision 2026-11-21)
#   - avivas-crafts-backup   cron job (Docker, ops/backup/), nightly encrypted backup at 00:30 UTC
#   - avivas-crafts-db       PostgreSQL 17, reachable on Render's private network only
#
# Fixed, non-secret settings are written out below. Every `sync: false` key has no value here:
# Render asks for it when the Blueprint is created, and the owner fills it in from the launch
# checklist (docs/launch-checklist.md). Secrets and domain-dependent values never go in this file,
# and neither does any `<shop domain>` placeholder.
#
# APP_ORIGIN is read at BUILD time (next.config.ts fixes the allowed origin and HSTS into the
# build). Set it on Render before the first build. Changing it later needs "Save, rebuild, and
# deploy", not a restart.

services:
  - type: web
    name: avivas-crafts
    runtime: node
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    buildCommand: corepack enable pnpm && pnpm install --frozen-lockfile --prod=false && pnpm build
    preDeployCommand: pnpm db:migrate && pnpm db:seed
    startCommand: pnpm start
    envVars:
      - key: APP_ENV
        value: production
      - key: STORAGE_DRIVER
        value: r2
      - key: EMAIL_DRIVER
        value: resend
      - key: PAYMENT_PROVIDER
        value: none
      - key: R2_JURISDICTION
        value: eu
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: OIDC_ISSUER
        value: https://accounts.google.com
      - key: DATABASE_URL
        fromDatabase:
          name: avivas-crafts-db
          property: connectionString
      - key: SECRET_HMAC_KEY
        generateValue: true
      - key: APP_ORIGIN
        sync: false
      - key: IMAGE_PUBLIC_ORIGIN
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_PRIVATE
        sync: false
      - key: R2_BUCKET_PUBLIC
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

  - type: cron
    name: avivas-crafts-backup
    runtime: docker
    region: frankfurt
    plan: starter
    branch: main
    autoDeployTrigger: commit
    dockerfilePath: ./ops/backup/Dockerfile
    dockerContext: ./ops/backup
    schedule: "30 0 * * *"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avivas-crafts-db
          property: connectionString
      - key: BACKUP_AGE_RECIPIENT
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: BACKUP_BUCKET
        sync: false
      - key: BACKUP_R2_ACCESS_KEY_ID
        sync: false
      - key: BACKUP_R2_SECRET_ACCESS_KEY
        sync: false
      - key: IMAGES_BUCKET_PRIVATE
        sync: false
      - key: IMAGES_BUCKET_PUBLIC
        sync: false
      - key: IMAGES_R2_ACCESS_KEY_ID
        sync: false
      - key: IMAGES_R2_SECRET_ACCESS_KEY
        sync: false

databases:
  - name: avivas-crafts-db
    region: frankfurt
    plan: basic-256mb
    postgresMajorVersion: "17"
    ipAllowList: []
