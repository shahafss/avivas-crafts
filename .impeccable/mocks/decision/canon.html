<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Category standard sketch</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:Heebo,Arial,sans-serif;background:#fff;color:#18181B}
header{display:flex;justify-content:space-between;align-items:center;padding:0 16px;height:60px;border-bottom:1px solid #E4E4E7}
.name{font-weight:700;font-size:20px}.tools{font-size:14px;display:flex;gap:14px;color:#52525B}
.search{margin:12px 16px;height:44px;border-radius:10px;background:#F4F4F5;display:flex;align-items:center;padding:0 14px;color:#71717A;font-size:15px}
h1{font-size:26px;line-height:34px;font-weight:700;padding:12px 16px 4px}
p{font-size:15px;line-height:22px;color:#52525B;padding:0 16px 12px}
.tabs{display:flex;gap:8px;padding:0 16px 16px}.tabs span{padding:6px 14px;border-radius:99px;background:#F4F4F5;font-size:14px}.tabs span:first-child{background:#18181B;color:#fff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 12px;padding:0 16px}
.ph{aspect-ratio:1;border-radius:12px;background:#F1F0EE}
.grid b{display:block;font-size:15px;font-weight:500;margin-top:8px}.grid span{font-size:15px;font-weight:700}
.btn{margin-top:6px;height:36px;border-radius:8px;background:#2F4EA6;color:#fff;display:grid;place-items:center;font-size:14px}
</style></head><body>
<header><div class="name">היצירות של אביבה</div><div class="tools"><span lang="en">EN</span><span>סל (2)</span></div></header>
<div class="search">חיפוש מוצרים</div>
<h1>בובות צמר בעבודת יד</h1><p>כל פריט נסרג לפי הזמנה.</p>
<div class="tabs"><span>הכול</span><span>בובות</span><span>חיות</span><span>אביזרים</span></div>
<div class="grid">
<div><div class="ph"></div><b>בובת נועה</b><span>180 ₪</span><div class="btn">הוספה לסל</div></div>
<div><div class="ph"></div><b>ארנב סרוג</b><span>140 ₪</span><div class="btn">הוספה לסל</div></div>
</div></body></html>
