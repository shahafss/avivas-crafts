<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Wrapped Gift sketch</title>
<style>
:root{--wrap:#1E3A9E;--wrap2:#2A4FC4;--tag:#FFFFFF;--ink:#1A1C2C;--ribbon:#F07C8E;--sun:#F4C430;--err:#B3243F}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:Heebo,Arial,sans-serif;color:var(--ink);
 background-color:var(--wrap);
 background-image:radial-gradient(circle at 25% 25%,var(--wrap2) 0 6px,transparent 7px),radial-gradient(circle at 75% 75%,var(--sun) 0 2px,transparent 3px);
 background-size:36px 36px}
.tag{background:var(--tag);position:relative;clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
.tag::before{content:"";position:absolute;inset-inline-end:10px;top:10px;width:10px;height:10px;border-radius:50%;border:2px solid var(--ink);background:var(--wrap)}
.head{margin:14px 14px 0;padding:14px 16px 16px}
.row{display:flex;justify-content:space-between;align-items:center;padding-inline-end:22px}
.name{font-weight:800;font-size:22px}
.tools{display:flex;gap:12px;font-size:14px;font-weight:600}
.cart{border:2px solid var(--ink);padding:4px 10px}
.head h1{font-size:28px;line-height:34px;font-weight:800;margin-top:12px}
.head p{font-size:16px;line-height:24px;margin-top:6px}
.ribbon{margin:16px 0;background:var(--ribbon);display:flex;gap:18px;padding:12px 16px;font-weight:700;font-size:15px;color:var(--ink)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 14px}
.card{padding:10px 10px 12px}
.ph{aspect-ratio:4/5;background:#ECE8E1;display:grid;place-items:center;font-size:12px;color:#55565c;margin-top:16px}
.card b{display:block;font-size:15px;line-height:22px;margin-top:8px}
.card span{font-size:16px;font-weight:800}
.na{color:var(--err);font-size:13px;font-weight:700}
</style></head><body>
<div class="tag head"><div class="row"><div class="name">היצירות של אביבה</div><div class="tools"><span lang="en">English</span><span class="cart">סל · 2</span></div></div>
<h1>כל בובה נסרגת אצלי ביד, במיוחד בשבילכם</h1><p>אני סורגת אחרי שהזמנתם. זמן ההכנה כתוב על כל פריט.</p></div>
<div class="ribbon"><span>בובות צמר</span><span>חיות</span><span>אביזרים</span><span>חיפוש</span></div>
<div class="grid">
<div class="tag card"><div class="ph">תמונה לדוגמה</div><b>בובת נועה</b><span>180 ₪</span></div>
<div class="tag card"><div class="ph">תמונה לדוגמה</div><b>ארנב סרוג</b><span>140 ₪</span></div>
<div class="tag card"><div class="ph">תמונה לדוגמה</div><b>דובי כחול</b><span>160 ₪</span></div>
<div class="tag card"><div class="ph">תמונה לדוגמה</div><b>כבשה קטנה</b><span class="na">לא זמין כרגע</span></div>
</div></body></html>
