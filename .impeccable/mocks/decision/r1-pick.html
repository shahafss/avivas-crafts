<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Maker's Market Stall sketch</title>
<style>
:root{--cloth:#0F5C4A;--card:#E9EFE9;--ink:#1B1B1B;--sign:#E8B04A;--err:#9E3522}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:Heebo,Arial,sans-serif;color:var(--ink);background:var(--cloth)}
.sign{background:var(--sign);margin:16px 16px 0;padding:14px 16px;border:3px solid var(--ink)}
.sign .row{display:flex;justify-content:space-between;align-items:center}
.name{font-weight:900;font-size:24px}
.tools{display:flex;gap:12px;font-size:14px;font-weight:700}
.sign p{font-size:16px;line-height:24px;margin-top:6px}
.cats{display:flex;gap:8px;padding:16px;color:#fff;font-weight:700;font-size:15px}
.cats span{border-bottom:2px solid #fff;padding-bottom:2px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 16px}
.ph{aspect-ratio:4/5;background:#DCD7CE;display:grid;place-items:center;font-size:12px;color:#4a4a4a}
.price{background:var(--card);margin:-14px 10px 0;position:relative;padding:8px 10px;border:2px solid var(--ink)}
.price b{display:block;font-size:15px}.price span{font-size:16px;font-weight:800}
.na{color:var(--err);font-size:13px;font-weight:700}
</style></head><body>
<div class="sign"><div class="row"><div class="name">היצירות של אביבה</div><div class="tools"><span lang="en">English</span><span>סל · 2</span></div></div><p>סרוג אצלי ביד, לפי הזמנה. בואו להסתכל.</p></div>
<div class="cats"><span>בובות צמר</span><span>חיות</span><span>אביזרים</span></div>
<div class="grid">
<div><div class="ph">תמונה לדוגמה</div><div class="price"><b>בובת נועה</b><span>180 ₪</span></div></div>
<div><div class="ph">תמונה לדוגמה</div><div class="price"><b>ארנב סרוג</b><span>140 ₪</span></div></div>
<div><div class="ph">תמונה לדוגמה</div><div class="price"><b>דובי כחול</b><span>160 ₪</span></div></div>
<div><div class="ph">תמונה לדוגמה</div><div class="price"><b>כבשה קטנה</b><span class="na">לא זמין כרגע</span></div></div>
</div></body></html>
