<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Ball Band sketch</title>
<style>
:root{--g:#F3F3F0;--ink:#1F1F1F;--mari:#E0A11B;--teal:#0F6E78;--plum:#6A2C5B}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:Heebo,Arial,sans-serif;background:var(--g);color:var(--ink)}
header{display:flex;justify-content:space-between;align-items:center;padding:16px;height:64px;border-bottom:3px solid var(--ink)}
.name{font-weight:800;font-size:22px}
.tools{font-size:14px;display:flex;gap:12px}
.shelf{display:flex;flex-direction:column}
.band{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;color:#fff;font-weight:800;font-size:22px}
.band small{font-size:13px;font-weight:600;border:1.5px solid #fff;border-radius:99px;padding:4px 12px}
h1{font-size:28px;line-height:36px;font-weight:800;padding:20px 16px 8px}
p.lead{font-size:16px;line-height:24px;padding:0 16px 16px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 16px}
.card{position:relative;background:#e6e3dc;aspect-ratio:4/5}
.label{position:absolute;inset-inline:0;bottom:16px;background:var(--mari);color:var(--ink);padding:6px 10px;transform:rotate(-2deg)}
.label b{display:block;font-size:15px}
.label span{font-size:15px;font-weight:800}
.t{background:var(--teal);color:#fff}.p{background:var(--plum);color:#fff}
</style></head><body>
<header><div class="name">היצירות של אביבה</div><div class="tools"><span lang="en">English</span><span>סל · 2</span></div></header>
<div class="shelf"><div class="band" style="background:var(--mari);color:var(--ink)">בובות צמר<small style="border-color:var(--ink)">24 פריטים</small></div><div class="band" style="background:var(--teal)">חיות<small>12 פריטים</small></div><div class="band" style="background:var(--plum)">אביזרים<small>8 פריטים</small></div></div>
<h1>סרוג ביד, לפי הזמנה</h1><p class="lead">כל פריט נסרג אחרי שהזמנתם. זמן ההכנה כתוב על התווית.</p>
<div class="grid">
<div class="card"><div class="label"><b>בובת נועה · מס׳ 014</b><span>180 ₪ · כשבועיים</span></div></div>
<div class="card"><div class="label t"><b>ארנב סרוג · מס׳ 027</b><span>140 ₪ · 10 ימים</span></div></div>
<div class="card"><div class="label p"><b>כובע תינוק · מס׳ 031</b><span>90 ₪ · שבוע</span></div></div>
<div class="card"><div class="label"><b>דובי כחול · מס׳ 009</b><span>160 ₪ · כשבועיים</span></div></div>
</div></body></html>
