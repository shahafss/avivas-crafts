<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=390">
<title>Knitting Chart sketch</title>
<style>
:root{--ground:#F6F7FA;--grid:#C7D1E5;--indigo:#26357F;--ink:#1C2033;--ochre:#D49B1C;--moss:#557A3C;--rasp:#B02E57;--u:8px}
*{box-sizing:border-box;margin:0}
body{width:390px;height:844px;overflow:hidden;font-family:Heebo,Arial,sans-serif;color:var(--ink);
 background:var(--ground);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:var(--u) var(--u)}
header{background:var(--indigo);color:#fff;padding:12px 16px 0}
.top{display:flex;align-items:center;justify-content:space-between;height:40px}
.name{font-weight:800;font-size:24px;letter-spacing:-.01em}
.tools{display:flex;gap:12px;font-size:14px;align-items:center}
.cart{border:2px solid #fff;padding:2px 8px;font-weight:700}
.edge{height:16px;margin:12px -16px 0;background:
 conic-gradient(from 90deg at 50% 50%,var(--ochre) 25%,var(--indigo) 0 50%,var(--ochre) 0 75%,var(--indigo) 0) 0 0/16px 16px}
.hook{background:var(--ground);margin:0 16px;padding:16px 0 8px}
.hook h1{font-size:30px;line-height:40px;font-weight:800}
.hook p{font-size:16px;line-height:24px}
.key{display:flex;gap:8px;flex-wrap:wrap;padding:8px 16px 16px}
.chip{display:flex;gap:6px;align-items:center;background:#fff;border:1px solid var(--ink);padding:4px 10px;font-size:14px;line-height:24px}
.sq{width:12px;height:12px;display:inline-block}
.chart{display:grid;grid-template-columns:24px 1fr 1fr;gap:8px;padding:0 16px 0 8px}
.row{font-size:12px;color:var(--indigo);font-weight:700;align-self:start;text-align:center;padding-top:4px}
.card{background:#fff;border:1px solid var(--ink)}
.ph{aspect-ratio:4/5;background:#e9e7e2;display:grid;place-items:center;color:#55565c;font-size:12px}
.meta{padding:6px 8px 8px}
.meta b{display:block;font-size:15px;line-height:24px}
.meta span{font-size:15px;font-weight:700}
.na{color:var(--rasp);font-size:12px;font-weight:700}
</style></head><body>
<header><div class="top"><div class="name">היצירות של אביבה</div><div class="tools"><span lang="en">English</span><span>חיפוש</span><span class="cart">סל · 2</span></div></div><div class="edge"></div></header>
<div class="hook"><h1>כל בובה נסרגת אצלי ביד, אחרי שהזמנתם</h1><p>אני סורגת כל פריט לפי הזמנה. זמן ההכנה כתוב בכל מוצר.</p></div>
<div class="key"><span class="chip"><i class="sq" style="background:var(--indigo)"></i>בובות צמר</span><span class="chip"><i class="sq" style="background:var(--ochre)"></i>חיות</span><span class="chip"><i class="sq" style="background:var(--moss)"></i>אביזרים</span></div>
<div class="chart">
<div class="row">1</div>
<div class="card"><div class="ph">תמונה לדוגמה</div><div class="meta"><b>בובת נועה</b><span>180 ₪</span></div></div>
<div class="card"><div class="ph">תמונה לדוגמה</div><div class="meta"><b>ארנב סרוג</b><span>140 ₪</span></div></div>
<div class="row">2</div>
<div class="card"><div class="ph">תמונה לדוגמה</div><div class="meta"><b>דובי כחול</b><span>160 ₪</span></div></div>
<div class="card"><div class="ph">תמונה לדוגמה</div><div class="meta"><b>כבשה קטנה</b><span class="na">לא זמין כרגע</span></div></div>
</div>
</body></html>
